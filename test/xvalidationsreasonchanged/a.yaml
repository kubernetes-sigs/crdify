---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: xvalidationexamples.example.com
spec:
  group: example.com
  names:
    kind: XValidationExample
    listKind: XValidationExampleList
    plural: xvalidationexamples
    singular: xvalidationexample
  scope: Namespaced
  versions:
  - name: v1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              code:
                type: string
                x-kubernetes-validations:
                - rule: "self == oldSelf"
                  message: "field is immutable"
                  reason: FieldValueForbidden

validations:
  - name: default
    enforcement: Error
  # example of configuring enum validation to allow addition of new enum constraint values
  - name: enum
    enforcement: Error
    configuration:
      additionPolicy: Allow
  # example of configuring pattern validation to allow removal of pattern constraints
  - name: pattern
    enforcement: Error
    configuration:
      removalPolicy: Allow
  # example of configuring nullable validation to allow making a field nullable and removing nullable support
  - name: nullable
    enforcement: Error
    configuration:
      additionPolicy: Allow
      removalPolicy: Allow
  # example of configuring oneOf validation to allow addition of new subschemas and removal of existing subschemas
  - name: oneOf
    enforcement: Error
    configuration:
      additionPolicy: Allow
      removalPolicy: Allow
  # example of configuring xvalidations validation to allow adding and removing x-kubernetes-validation rules
  - name: xvalidations
    enforcement: Error
    configuration:
      additionPolicy: Allow
      removalPolicy: Allow
